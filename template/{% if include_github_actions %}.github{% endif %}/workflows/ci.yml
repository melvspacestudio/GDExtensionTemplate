name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (macOS)
    runs-on: [self-hosted, macos]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
          activate-environment: true
          venv-path: ${{ runner.temp }}/gdextension-python
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: just
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Rust formatting and lint
        run: just check
      - name: Build libraries and import Godot sandbox
        run: just check-godot
      - name: Build and package optimized libraries
        run: just package
